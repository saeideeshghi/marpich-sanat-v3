<!-- Shared template: faq. Content values come from src/data/pages at build time. -->
<section class="industry-textile__faq site-faq" data-faq data-single-open="true" aria-labelledby="{{id}}">
    <h2 id="{{id}}" class="industry-textile__section-title">{{title}}</h2>

    <div class="industry-textile__faq-list"> {{{items}}} </div>

    <a class="industry-textile__faq-more site-text-link" href="{{href}}"
        ><span class="site-text-link__label">{{linkText}}</span></a
    >
</section>
